
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Product Enquiry</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
            display: flex;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        /* Left Section */
        .contact-info {
            width: 40%;
            background: #2563eb;
            color: white;
            padding: 45px 35px;
        }

        .contact-info h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        .contact-info p {
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .info {
            margin: 25px 0;
        }

        .info h3 {
            margin-bottom: 7px;
        }

        /* Right Section */
        .contact-form {
            width: 60%;
            padding: 45px 40px;
        }

        .contact-form h2 {
            margin-bottom: 25px;
            color: #222;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .contact-info,
            .contact-form {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Contact Information -->
        <div class="contact-info">

            <h1>Contact Us</h1>

            <p>
                Have a question about our products?
                Send us your enquiry and our team will
                get back to you soon.
            </p>

            <div class="info">
                <h3>📍 Address</h3>
                <p>Ghaziabad, Uttar Pradesh, India</p>
            </div>

            <div class="info">
                <h3>📞 Phone</h3>
                <p>+91 98765 43210</p>
            </div>

            <div class="info">
                <h3>✉ Email</h3>
                <p>support@example.com</p>
            </div>

        </div>


        <!-- Product Enquiry Form -->
        <div class="contact-form">

            <h2>Product Enquiry</h2>

            <form id="enquiryForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="product">Select Product</label>

                    <select id="product" required>
                        <option value="">-- Select Product --</option>
                        <option value="Product 1">Product 1</option>
                        <option value="Product 2">Product 2</option>
                        <option value="Product 3">Product 3</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity Required</label>

                    <input
                        type="number"
                        id="quantity"
                        min="1"
                        placeholder="Enter quantity"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="enquiry">Your Enquiry</label>

                    <textarea
                        id="enquiry"
                        placeholder="Write your product enquiry..."
                        required
                    ></textarea>
                </div>

                <button type="submit">
                    Send Enquiry
                </button>

                <div id="message"></div>

            </form>

        </div>

    </div>


    <script>
        document.getElementById("enquiryForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value;
            let product = document.getElementById("product").value;

            document.getElementById("message").innerHTML =
                "Thank you, " + name + "! Your enquiry for " +
                product + " has been submitted successfully.";

            document.getElementById("message").style.color = "green";

            document.getElementById("enquiryForm").reset();
        });
    </script>

</body>
</html>
